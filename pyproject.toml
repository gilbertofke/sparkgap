[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'sparkgap'
version = '0.1.0.dev0'
description = 'Daraja doctor and failure mock server for M-Pesa integrations.'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.10'
authors = [{ name = 'Gilbert Cheruiyot Tangus' }]
dependencies = []

[dependency-groups]
dev = ['pytest>=8', 'pytest-cov', 'ruff', 'mypy', 'pre-commit']

[tool.hatch.build.targets.wheel]
packages = ['src/sparkgap']

[tool.ruff]
line-length = 100
target-version = 'py310'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP']

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ['tests']
